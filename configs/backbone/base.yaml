# Load with BackboneConfig.from_dict(yaml.safe_load(...)).
feature_dim: 128
patch_seconds: 1.0
patch_encoder:
  variant: sequence
  subpatch_samples: 20
  hidden_dim: 64
  position_embedding: true
  readout: mean
  blocks:
    - kind: cnn
      depth: 2
      cnn: {kernel_size: 3}
    - kind: transformer
      depth: 1
      transformer: {num_heads: 4, expansion: 4, dropout: 0.0}
sequence_encoder:
  window_seconds: 30.0
  position_embedding: true
  causal: false
  blocks:
    - kind: transformer
      depth: 2
      transformer: {num_heads: 4, expansion: 4, dropout: 0.0}
channel_aggregation: attention
channel_embedding: true
fusion: cross_attention
modality_embedding: true
fusion_heads: 4
