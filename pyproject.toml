[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-world-model"
version = "0.1.0"
description = "Sleep physiology preprocessing and minimal SIGReg self-supervised learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "scipy>=1.14,<2",
    "pyarrow>=15",
    "torch>=2.0",
    "PyYAML>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
train = ["python-dotenv>=1.0", "wandb>=0.21", "tqdm>=4.66"]
dev = ["ruff>=0.12"]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0", "nbclient>=0.10"]

[project.scripts]
build-hsp-manifest = "dataloader.readers.hsp_raw.cli:main"
train-sleep-ssl = "world_model.training.ssl_cli:main"
debug-sleep-ssl = "world_model.debugging.ssl_step:main"

[tool.setuptools.packages.find]
include = [
    "backbone*",
    "dataloader*",
    "pretraining*",
    "tokenization*",
    "world_model*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
